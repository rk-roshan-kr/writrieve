[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "write4u"
version = "0.1.0"
description = "Task-aware personal context engine for open-weight language models"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Write4U Contributors" }
]
keywords = [
    "context-engine",
    "open-weight",
    "qwen",
    "bge-reranker",
    "mcp",
    "rag",
    "personal-ai",
    "browser-extension"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0"
]

[project.urls]
Homepage = "https://github.com/write4u/write4u"
Repository = "https://github.com/write4u/write4u"
"Bug Tracker" = "https://github.com/write4u/write4u/issues"
Documentation = "https://github.com/write4u/write4u#readme"
